server:
  run-mode: 'debug'
  http-port: 8000
  read-timeout: 60
  write-timeout: 60

app:
  domain: localhost
  page-size: 10
  jwt-secret: shop
  prefix-url: 'http://127.0.0.1:8000'
  runtime-root-path: 'runtime/'
  image-save-path: 'upload/images/'
  # MB
  image-max-size: 5242880
  image-allow-exts: ['.jpg','.jpeg','.png']
  export-save-path: 'export/'
  qrcode-save-path: 'qrcode/'
  font-save-path: 'fonts/'
  log-save-path: 'logs/'
  Log-save-name: 'log'
  Log-file-ext: 'log'
  time-format: 20060102

api:
  search-product-ak: AK100523687952
  search-product-sk: W1WTYvJpfeH1YpUjTpeFbEx^DnpQ&35L

database:
  type: 'mysql'
  user: 'root'
  password: 'admin123'
  host: '127.0.0.1:3306'
  name: 'shop'
  table_prefix:

redis:
  host: '127.0.0.1:6379'
  password: 123456
  idle_timeout: 200

kafka:
  hosts: ["127.0.0.1:9092"]
#  hosts: ["host.docker.internal:9092"]

zap:
  log-level: 'info'
  log-mode: 'console'          # 生产环境改为 'json'
  log-output: 'both'           # 生产环境改为 'stdout'（ELK）或 'file'
  log-filepath: 'runtime/logs'
  log-file-ext: 'log'
  max-size: 100                # 单文件 100MB
  max-age: 30                  # 保留 30 天
  max-backups: 30              # 最多 30 个文件
  compress: true
  modules:
    - 'app'                    # 默认全局
    - 'order'                  # 订单
    - 'product'                # 商品
    - 'user'                   # 用户
    - 'auth'                   # 鉴权/登录
    - 'http'                   # HTTP 请求/中间件
    - 'menu'                   # 菜单
    - 'role'                   # 角色
    - 'upload'                 # 文件上传
    - 'mysql'                  # MySQL 业务/错误日志
    - 'mysql_query'            # MySQL SQL 查询日志（与 mysql 分离）
    - 'mq'                     # Kafka 消息队列日志
    - 'product_sync'            # 商品同步
    - 'order_report'            # 订单统计报表
    - 'worker'                   # Worker 消费引擎日志

worker:
  enabled: true
  group-id: "shop-worker"

  # ===== 方式一：per-Handler 独立配置（推荐） =====
  handlers:
    - topic: "shop-order-events"
      concurrency: 2
      ordered: false
      buffer-size: 2000
    - topic: "shop-product-events"
      concurrency: 2
      ordered: false
      buffer-size: 1000

  # ===== 方式二：全局配置（向后兼容，handlers 为空时生效） =====
  topics:
    - "shop-product-events"
    - "shop-order-events"
  concurrency: 10

  # 全局默认值（handlers 中未指定的字段使用此默认值）
  default-concurrency: 10
  default-buffer-size: 1000

  poll-interval: "2s"
  max-retries: 5
  retry-base-delay: "1s"
  relay-batch-size: 100
  relay-lease-timeout: "60s"
  relay-cleanup-days: 30
  handler-timeout: "30s"    # 单条消息处理超时时间

  # ===== Redis Stream 延迟队列消费者 =====
  redis-stream:
    enabled: true
    concurrency: 2              # 全局默认并发数
    buffer-size: 500            # 全局默认缓冲大小
    block-timeout: "5s"         # XReadGroup BLOCK 超时
    handler-timeout: "30s"      # 单条消息处理超时
    max-retries: 5              # Pending 消息最大重试次数
    streams:
      - stream-key: "delay-order-timeout"    # Redis Stream key（与 TopicDelayOrderTimeout 一致）
        consumer-group: "shop-delay-group"   # 消费组名称
        consumer-name: "shop-worker-1"       # 消费者名称
        concurrency: 2                       # Worker Pool 并发数（0 使用全局默认）
        buffer-size: 500                     # tasks channel 缓冲大小（0 使用全局默认）

  # ===== 多队列模式（与 handlers/topics 互斥，启用后忽略旧配置） =====
  # processes:
  #   # Kafka 实时事件流
  #   - name: kafka-order-consumer
  #     type: kafka
  #     config:
  #       group-id: shop-worker
