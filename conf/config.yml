server:
  run-mode: 'debug'
  http-port: 8000
  read-timeout: 60
  write-timeout: 60

app:
  domain: localhost
  page-size: 10
  jwt-secret: shop
  prefix-url: 'http://127.0.0.1:8000'
  runtime-root-path: 'runtime/'
  image-save-path: 'upload/images/'
  # MB
  image-max-size: 5242880
  image-allow-exts: ['.jpg','.jpeg','.png']
  export-save-path: 'export/'
  qrcode-save-path: 'qrcode/'
  font-save-path: 'fonts/'
  log-save-path: 'logs/'
  Log-save-name: 'log'
  Log-file-ext: 'log'
  time-format: 20060102

api:
  search-product-ak: AK100523687952
  search-product-sk: W1WTYvJpfeH1YpUjTpeFbEx^DnpQ&35L

database:
  type: 'mysql'
  user: 'root'
  password: 'admin123'
  host: '127.0.0.1:3306'
  name: 'shop'
  table_prefix:

redis:
  host: '127.0.0.1:6379'
  password: 123456
  idle_timeout: 200

kafka:
  hosts: ["127.0.0.1:9092"]
#  hosts: ["host.docker.internal:9092"]

zap:
  log-level: 'info'
  log-mode: 'console'          # 生产环境改为 'json'
  log-output: 'both'           # 生产环境改为 'stdout'（ELK）或 'file'
  log-filepath: 'runtime/logs'
  log-file-ext: 'log'
  max-size: 100                # 单文件 100MB
  max-age: 30                  # 保留 30 天
  max-backups: 30              # 最多 30 个文件
  compress: true
  modules:
    - 'app'                    # 默认全局
    - 'order'                  # 订单
    - 'product'                # 商品
    - 'user'                   # 用户
    - 'auth'                   # 鉴权/登录
    - 'http'                   # HTTP 请求/中间件
    - 'menu'                   # 菜单
    - 'role'                   # 角色
    - 'upload'                 # 文件上传
    - 'mysql'                  # MySQL 业务/错误日志
    - 'mysql_query'            # MySQL SQL 查询日志（与 mysql 分离）
    - 'mq'                     # Kafka 消息队列日志
    - 'product_sync'            # 商品同步
    - 'order_report'            # 订单统计报表
    - 'worker'                   # Worker 消费引擎日志

worker:
  enabled: true
  group-id: "shop-worker"
  topics:
    - "shop-product-events"
    - "shop-order-events"
  concurrency: 10
  poll-interval: "2s"
  max-retries: 5
  retry-base-delay: "1s"
  relay-batch-size: 100
  relay-lease-timeout: "60s"

wechat:
  app_id:
  app_secret:
  token: shop
  encoding_aes_key:

express:
  eBusinessId: 1607734
  appKey: 81f43a2e-f504-45c4-9b54-2637d59f8190
